[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-realtime-chat-messaging"
version = "0.1.0"
description = "A reusable realtime chat messaging Django app"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
authors = [
    { name="Peter Erinfolami", email="petersp2000@gmail.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "Django>=4.2", 
    "djangorestframework",  
    "django-guardian", 
    "django-polymorphic", 
    "django-rest-polymorphic", 
    "drf-recursive", 
    "bleach", 
    "channels", 
    "channels-redis", 
    "daphne"
]
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent"
]
[tool.setuptools.packages.find]
where = ["src"]